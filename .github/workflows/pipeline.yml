name: DevSecOps CI Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to trigger it manually

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Backend
        run: |
          cd Application-Code/backend
          npm install

      - name: Build Frontend
        run: |
          cd Application-Code/frontend
          npm install

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        run: |
          docker build -t an619/three-tier-backend:v1 ./Application-Code/backend
          docker push an619/three-tier-backend:v1

      - name: Build and Push Frontend Image
        run: |
          docker build -t an619/three-tier-frontend:v1 ./Application-Code/frontend
          docker push an619/three-tier-frontend:v1