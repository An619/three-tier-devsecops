name: DevSecOps CI Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-scan-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- Backend Phase ---
      - name: Build Backend Image Locally
        run: docker build -t an619/three-tier-backend:latest ./Application-Code/backend

      - name: Run Trivy Scan on Backend Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'an619/three-tier-backend:latest'
          format: 'table'
          exit-code: '1' 
          ignore-unfixed: true 
          severity: 'CRITICAL,HIGH'
          # Ignore global npm/yarn tools. We only care about OS and app vulnerabilities.
          skip-dirs: 'usr/local/lib/node_modules,opt/yarn-v1.22.22'

      # --- Frontend Phase ---
      - name: Build Frontend Image Locally
        run: docker build -t an619/three-tier-frontend:latest ./Application-Code/frontend

      - name: Run Trivy Scan on Frontend Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'an619/three-tier-frontend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          skip-dirs: 'usr/local/lib/node_modules,opt/yarn-v1.22.22'

      # --- Deployment Phase (Only runs if scans pass) ---
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Backend Image
        run: docker push an619/three-tier-backend:latest

      - name: Push Frontend Image
        run: docker push an619/three-tier-frontend:latest