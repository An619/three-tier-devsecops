apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: three-tier-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/An619/three-tier-devsecops.git'
    targetRevision: HEAD
    path: 'Kubernetes-Manifests-file'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: three-tier
  syncPolicy:
    automated:
      prune: true
      selfHeal: true